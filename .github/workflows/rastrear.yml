name: Rastreador de ofertas

on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 minutos (GitHub puede demorarlo unos minutos)
  workflow_dispatch:
    inputs:
      modo:
        description: "Que ejecutar"
        type: choice
        default: correr
        options: [correr, diagnostico, sonda, ver]
      urls:
        description: "Solo para sonda: direcciones separadas por espacio"
        default: ""
      solo:
        description: "Solo para correr: nombre de una unica tienda"
        default: ""
      cadena:
        description: "si = al terminar, lanza la corrida siguiente (respaldo del horario)"
        default: "no"
      patron:
        description: "Solo para ver: expresion a buscar"
        default: ""

concurrency:
  group: rastreador-${{ github.event.inputs.modo || 'correr' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer el historial guardado (rama datos)
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" datos >/dev/null 2>&1; then
            git clone --quiet --depth=1 --branch datos "$REPO_URL" data
            rm -rf data/.git
          else
            mkdir -p data
          fi

      - name: Ejecutar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SONDA_URLS: ${{ github.event.inputs.urls }}
          VER_PATRON: ${{ github.event.inputs.patron }}
          SOLO_TIENDA: ${{ github.event.inputs.solo }}
        run: python rastreador.py "${{ github.event.inputs.modo || 'correr' }}"

      - name: Guardar el historial (un solo commit, no engorda el repo)
        run: |
          cd data
          git init --quiet -b datos
          git config user.name "rastreador"
          git config user.email "rastreador@users.noreply.github.com"
          git add -A
          git commit --quiet -m "datos $(date -u +%FT%TZ)" || exit 0
          git push --quiet --force "$REPO_URL" datos

      - name: Encadenar la proxima corrida (respaldo mientras el horario de GitHub no arranca)
        if: github.event.inputs.cadena == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/runs?event=schedule" --jq '.total_count')
          if [ "$n" -gt 0 ]; then echo "El horario ya funciona; se corta la cadena."; exit 0; fi
          sleep 1200
          gh workflow run rastrear.yml --repo "${{ github.repository }}" --ref main -f modo=correr -f cadena=si
